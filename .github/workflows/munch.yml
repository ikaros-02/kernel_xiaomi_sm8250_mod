name: Build munch SukiSU repack

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install deps
        run: |
          sudo apt update
          sudo apt install -y build-essential git curl wget bison flex zip bc cpio libssl-dev ccache python-is-python3 tar unzip gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Setup ZyC clang
        run: |
          mkdir -p $HOME/zyc-clang
          cd $HOME/zyc-clang
          wget -q https://github.com/ZyCromerZ/Clang/releases/download/15.0.7-20251111-release/Clang-15.0.7-20251111.tar.gz
          tar xzf Clang-15.0.7-20251111.tar.gz
          cd $GITHUB_WORKSPACE

      - name: Build kernel SukiSU SUSFS
        continue-on-error: true
        run: |
          sed -i '/^[[:space:]]*-e KSU[[:space:]]*\$/a\    -e KSU_MANUAL_HOOK \\' build.sh
          grep -n 'KSU_MANUAL_HOOK' build.sh
          bash build.sh munch ksu

      - name: Extract AOSP Image
        run: |
          ls -l Kernel_AOSP_munch_*.zip
          mkdir -p aosp
          unzip -o Kernel_AOSP_munch_*.zip 'kernels/Image' -d aosp
          ls -l aosp/kernels/Image

      - name: Get magiskboot
        run: |
          wget -q https://github.com/topjohnwu/Magisk/releases/download/v27.0/Magisk-v27.0.apk -O magisk.apk
          unzip -o magisk.apk 'lib/x86_64/libmagiskboot.so' -d mb
          cp mb/lib/x86_64/libmagiskboot.so magiskboot
          chmod +x magiskboot

      - name: Get clean stock boot
        run: wget -q https://github.com/ikaros-02/k40s-kernelsu/releases/download/base-boot/clean_stock_boot.img -O clean_stock_boot.img

      - name: Repack boot
        run: |
          mkdir -p w
          cd w
          cp ../clean_stock_boot.img boot.img
          ../magiskboot unpack boot.img
          cp ../aosp/kernels/Image kernel
          ../magiskboot repack boot.img new_boot.img
          ls -l new_boot.img
          cp new_boot.img ../ksu_boot.img

      - name: Upload ksu boot
        uses: actions/upload-artifact@v4
        with:
          name: ksu_boot
          path: ksu_boot.img
